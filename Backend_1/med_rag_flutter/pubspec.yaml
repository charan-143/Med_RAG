name: med_rag_flutter
description: Clinical Atelier — Medical RAG Patient Records App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2
  
  # State management
  provider: ^6.1.2
  
  # UI Utilities
  google_fonts: ^6.2.1
  
  # File picking
  file_picker: ^8.0.5
  
  # Misc
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
